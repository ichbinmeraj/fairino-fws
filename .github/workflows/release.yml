name: Release

# Publishes to PyPI when a version tag (v1.2.3) is pushed, using PyPI
# Trusted Publishing (OIDC) — no API token is stored anywhere.
#
# One-time setup on PyPI (https://pypi.org/manage/account/publishing/):
#   Project name:      fairino-fws
#   Owner:             ichbinmeraj
#   Repository:        fairino-fws
#   Workflow name:     release.yml
#   Environment:       pypi

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
